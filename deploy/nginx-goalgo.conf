# /etc/nginx/sites-available/app.goalgo.fairwoodit.com
#
# GOALGO only. Do NOT edit the existing server block that serves
# goalgo.fairwoodit.com — that host belongs to OpenAlgo and must keep working.
#
# After copying:
#   ln -s /etc/nginx/sites-available/app.goalgo.fairwoodit.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.goalgo.fairwoodit.com

server {
    listen 80;
    listen [::]:80;
    server_name app.goalgo.fairwoodit.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.goalgo.fairwoodit.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/app.goalgo.fairwoodit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.goalgo.fairwoodit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 1m;
    proxy_read_timeout 60s;

    # Rate limit the public TradingView webhook (zone declared in nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=goalgo_hook:10m rate=10r/s;)
    location /api/public/webhooks/ {
        limit_req zone=goalgo_hook burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Required once in the http{} block of /etc/nginx/nginx.conf:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   limit_req_zone $binary_remote_addr zone=goalgo_hook:10m rate=10r/s;
