# /etc/nginx/sites-available/goalgo.fairwoodit.com
#
# SINGLE PUBLIC DOMAIN.
#   https://goalgo.fairwoodit.com/   -> GOALGO      (127.0.0.1:3000)
#   OpenAlgo                          -> 127.0.0.1:5000, NOT exposed publicly.
#
# OpenAlgo stays private. Reach its admin UI through an SSH tunnel:
#   ssh -N -L 5000:127.0.0.1:5000 root@210.56.147.234
#   then open http://localhost:5000 in your browser.
#
# After copying:
#   ln -s /etc/nginx/sites-available/goalgo.fairwoodit.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d goalgo.fairwoodit.com

server {
    listen 80;
    listen [::]:80;
    server_name goalgo.fairwoodit.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goalgo.fairwoodit.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/goalgo.fairwoodit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goalgo.fairwoodit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 1m;
    proxy_read_timeout 60s;

    # Rate limit the public TradingView webhook (zone declared in conf.d/goalgo-common.conf:
    #   limit_req_zone $binary_remote_addr zone=goalgo_hook:10m rate=10r/s;)
    location /api/public/webhooks/ {
        limit_req zone=goalgo_hook burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OPTIONAL — broker OAuth callback passthrough.
    #
    # Some brokers redirect the login flow back to a PUBLIC https URL that must
    # reach OpenAlgo itself. Only enable this if your broker's OpenAlgo setup
    # page tells you the exact callback path; do not guess. Enable by running
    # deploy.sh with OPENALGO_PUBLIC_PATHS="/zerodha/callback /angel/callback"
    # (deploy.sh writes one location block per path, nothing wider).
    #
    # location = /<broker>/callback {
    #     proxy_pass http://127.0.0.1:5000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Required once in the http{} block (deploy.sh writes these to
# /etc/nginx/conf.d/goalgo-common.conf so nginx.conf is never edited):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   limit_req_zone $binary_remote_addr zone=goalgo_hook:10m rate=10r/s;
